  <g transform="translate(812 495)"><use href="#calibration"/><g transform="translate(80 0)"><use href="#waveNormal"/><use href="#waveNormal" transform="translate(180 0)"/><use href="#waveNormal" transform="translate(360 0)"/><use href="#waveNormal" transform="translate(540 0)"/></g></g>
  <g transform="translate(812 620)"><use href="#calibration"/><g transform="translate(80 0)"><use href="#waveNormal"/><use href="#waveNormal" transform="translate(180 0)"/><use href="#waveNormal" transform="translate(360 0)"/><use href="#waveNormal" transform="translate(540 0)"/></g></g>
